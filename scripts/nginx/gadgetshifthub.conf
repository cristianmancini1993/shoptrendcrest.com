# Nginx vhost for gadgetshifthub.com (static site)
# Installed by scripts/server-bootstrap.sh

server {
    listen 80;
    listen [::]:80;
    server_name
        gadgetshifthub.com www.gadgetshifthub.com
        hubaurashop.com www.hubaurashop.com
        shopterva.com www.shopterva.com
        shoptrendcrest.com www.shoptrendcrest.com
        devicegridbay.com www.devicegridbay.com
        shoproomdock.com www.shoproomdock.com
        hometrendlivora.com www.hometrendlivora.com;

    root /var/www/gadgetshifthub.com;
    index index.html;

    # Let certbot handle HTTPS redirect after certificates are issued.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
